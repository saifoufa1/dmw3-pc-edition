# DMW3 PC Edition - starter packs offered after the Digimon Online sign-up (our own data file, edit freely).
#
# The three packs are the ORIGINAL ones of the Digimon Online registration (reference shots 13-15, 24-26):
#   A Balanced: Kotemon, Renamon, Patamon    B Powerful: Monmon, Agumon, Renamon    C Maniac: Kumamon, Guilmon, Patamon
#
# pack LETTER NAME SUMMARY
# member SPRITE "Name" ICON FRAMES DESC       (first member = the partner that starts active; Tab switches in the field)
#   NAME / SUMMARY / DESC: @N = message N of the original registration text DAT/COUNTRY/USA/USNAMEET.BIN
#                          (read from your disc at runtime), or "our own text" ('/' = new line).
#   SPRITE = DAT/FIELD/SPRT id; ICON = first frame id of the animated 32x32 portrait in DAT/NAMEENT/NE_DATA_
#   (-1 = none), FRAMES = how many frames it animates over.
# Field sprites: P003PKEN Kotemon, P004KOGU Kumamon, P005KOET Monmon, P006AGUM Agumon, P007VMON Veemon,
#                P008GIRU Guilmon, P009RENA Renamon, P010PATA Patamon.
# USNAMEET: 10-12 pack names, 26-28 pack summaries, 13 Kotemon, 14 Monmon, 15 Kumamon, 16 Agumon,
#           18 Guilmon, 19 Renamon, 20 Patamon (17 "Veemon" + nothing: Veemon is not a starter).

