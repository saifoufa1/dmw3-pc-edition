# DMW3 PC Edition - Digimon species data (our own file: edit freely, plain text).
#
# digimon SPRITE "Name" hp BASE +GROW mp BASE +GROW atk BASE +GROW def BASE +GROW spd BASE +GROW
#     Lv 1 stats of a freshly downloaded Digimon and what each level up adds. Every team member keeps its OWN
#     level, EXP and stats in the save (member lines), so training/items can change them later.
# path SPRITE Rookie@1 Form@LEVEL[:MODEL] ...
#     the digivolve path: in battle a Digimon can digivolve (DV gauge full) up to the last form whose LEVEL it has
#     reached. MODEL = DAT/MODEL prefix of the form's 3D battle model; without one the field sprite is drawn
#     (bigger + tinted). A form named Champion / Ultimate / Mega is a placeholder: shown as "Kotemon (Champion)".
#
# PLACEHOLDER numbers: base stats / growth are ours (the original stat tables are not decoded yet). They follow the
# original pack texts (Kotemon balanced, Monmon/Agumon power, Kumamon guns, Renamon magic, Patamon healing).
# PLACEHOLDER paths: only the Agumon line has its real 3D models. The original DW3 digivolutions are learned at the
# Digimon Lab and are not decoded yet; the owner will set the real paths here.

digimon P003PKEN "Kotemon"  hp 125 +11  mp 55 +4  atk 10 +2  def 10 +2  spd 10 +1
digimon P004KOGU "Kumamon"  hp 110 +9   mp 65 +5  atk 11 +2  def 7 +1   spd 9 +1
